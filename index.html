    <script>
      // Apparition au défilement de la page d’accueil (voir « rw-io » dans landing.css).
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
        var selector = ".rw-moment:not(.rw-hero) .rw-moment-grid > *, .rw-principles > *, .rw-faq > h2, .rw-faq > div, .rw-final h2, .rw-wordmark-stage";
        function run() {
          var items = document.querySelectorAll(selector);
          if (!items.length) return;
          document.documentElement.classList.add("rw-io");
          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-in");
              observer.unobserve(entry.target);
            });
          }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
          items.forEach(function (item) { item.classList.add("rw-reveal-item"); observer.observe(item); });
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
      })();
    </script>
    <script>
      // Lecteur du verset d’al-Kahf : lecture au clic, barre de progression, arrêt quand la carte sort de l’écran.
      (function () {
        function run() {
          var player = document.querySelector("[data-rw-player]");
          if (!player) return;
          var audio = player.querySelector("audio");
          var button = player.querySelector("button");
          var bar = player.querySelector(".rw-progress");
          button.addEventListener("click", function () {
            if (audio.paused) audio.play(); else audio.pause();
          });
          audio.addEventListener("play", function () { player.setAttribute("data-playing", ""); });
          audio.addEventListener("pause", function () { player.removeAttribute("data-playing"); });
          audio.addEventListener("ended", function () { bar.style.setProperty("--rw-p", "0%"); });
          audio.addEventListener("timeupdate", function () {
            if (audio.duration) bar.style.setProperty("--rw-p", (audio.currentTime / audio.duration) * 100 + "%");
          });
          if ("IntersectionObserver" in window) {
            new IntersectionObserver(function (entries) {
              if (!entries[0].isIntersecting && !audio.paused) audio.pause();
            }).observe(player.closest(".rw-device") || player);
          }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
      })();
    </script>
